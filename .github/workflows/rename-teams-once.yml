name: Rename teams once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-teams-once.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rename teams in portal snapshot only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'ZULATORS FC': 'ZUTALORS FC',
              'PORCELLONA': 'RAYO VADOPIANO',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected old team name not found: {old}')
              s = s.replace(old, new)
          s = s.replace('"publishedAt":"2 ottobre 2026","publishedTime":"19:55"', '"publishedAt":"3 ottobre 2026","publishedTime":"08:25"')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit portal rename
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Rename teams in portal"
          git push
