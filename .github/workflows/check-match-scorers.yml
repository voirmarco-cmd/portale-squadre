name: Controllo marcatori pubblicati
on:
  push:
    branches: [main]
    paths:
      - index.html
      - scripts/check-match-scorers.mjs
      - .github/workflows/check-match-scorers.yml
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scorers-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Controlla marcatori di coppe e campionati
        run: node scripts/check-match-scorers.mjs
